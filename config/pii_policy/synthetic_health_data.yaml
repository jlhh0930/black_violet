version: 1
domain: synthetic_health
entities:
  patients:
    fields:
      patient_id:
        classification: PHI
        mode: re_identifiable_token
        token_column: patient_id_token
      email:
        classification: PII
        mode: non_reversible_mask
        mask:
          type: redact
          output_column: email_masked
      phone:
        classification: PII
        mode: non_reversible_mask
        mask:
          type: hash_sha256
          output_column: phone_hash
      birth_date:
        classification: PHI
        mode: non_reversible_mask
        mask:
          type: redact
          output_column: birth_date_masked

  encounters:
    fields:
      patient_id:
        classification: PHI
        mode: join_by_token
        input_patient_id_column: patient_id
        output_patient_id_token_column: patient_id_token
