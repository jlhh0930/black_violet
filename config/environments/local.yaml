gcp:
  project_id: "your-gcp-project-id"
  region: "us-central1"

bq:
  datasets:
    silver: "lakehouse_silver"
    gold: "lakehouse_gold"
    restricted: "lakehouse_restricted"
  tables:
    mapping_patient_id: "mapping_patient_id"

gcs:
  bucket: "your-bucket-name"
  prefix: "lakehouse_demo"

secrets:
  # These env vars must be set in your shell or in your k8s Job/Deployment env
  pii_hash_salt_env_var: "PII_HASH_SALT"
  pii_token_lookup_salt_env_var: "PII_TOKEN_LOOKUP_SALT"
  pii_token_key_version_env_var: "PII_TOKEN_KEY_VERSION"
