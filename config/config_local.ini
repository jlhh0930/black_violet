[default]
region = us-east-1
dbt_manifest = dbt-manifest-account-region
dbt_pipeline_dir = pipeline/env
severity_level = debug

[aws]
region = us-east-1

[redshift]
secret_arn = arn:aws:secretsmanager:region:account:secret:secret-name
data_warehouse_name = dev_product_dw
unload_iam_role = arn:aws:iam::account:role/role-name

[s3]
staging_bucket =
staging_prefix =
archive_bucket =
archive_prefix =
etl_log_bucket =
etl_log_prefix =

[sqs]
hyper_queue_name = queue-name

[hst]
hst_messaging_arn = arn:aws:sns:region:account:resource-name
hst_message_resource =  pipeline-name

[sftp]
sftp_bucket = sftp-bucket-name-account
sftp_prefix = env/prefix/name
sftp_kms = arn:aws:kms:region:account:key/key-value